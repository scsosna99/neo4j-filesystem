plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.scottsosna.neo4jfs'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':neo4jfs')
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.7'
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.8.6'
}

test {
    useJUnitPlatform()
}