allprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.42'
        implementation 'org.apache.commons:commons-lang3:3.18.0'
        implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
        implementation 'org.neo4j:neo4j-ogm-core:4.0.21'
        implementation 'org.neo4j:neo4j-ogm-bolt-driver:4.0.21'
        implementation 'org.springframework.boot:spring-boot-starter:3.5.7'
        implementation 'org.springframework.boot:spring-boot-starter-security:3.5.7'

        // Align all JUnit 5 artifacts to latest stable versions to avoid mismatch
        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
        testImplementation 'org.mockito:mockito-core:5.12.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
        testImplementation 'org.mockito:mockito-inline:5.2.0'
    }

    test {
        useJUnitPlatform()
    }
}

